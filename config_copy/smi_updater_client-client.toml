#SMI Updater Client – Configuration
[client]
	#Enable automatic mod update checks on startup.
	enabled = true
	#URL of the SMI Updater server.
	#Example: http://play.myserver.net:25901
	serverUrl = "http://199.83.103.123:25737"
	#HTTP timeout in seconds when contacting the update server.
	# Default: 30
	# Range: 1 ~ 300
	timeoutSeconds = 30
	#Remember BasicLogin passwords locally and auto-login on reconnect.
	basicLoginRememberEnabled = true
	#Delete remembered BasicLogin token after this many days without joining the server.
	# Default: 2
	# Range: 1 ~ 30
	basicLoginTokenTtlDays = 2
	#Ticks to wait after joining before sending the remembered /login command.
	# Default: 40
	# Range: 0 ~ 200
	basicLoginAutoLoginDelayTicks = 40
